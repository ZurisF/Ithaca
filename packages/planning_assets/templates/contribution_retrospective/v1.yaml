    {"title": "结果证据", "goal": "验证产出和质量变化", "complete_when": "能提供可核验的指标或案例"},
    {"title": "失误与学习", "goal": "复盘遇到的限制或失误", "complete_when": "能说明归因及修正"},
    {"title": "下一轮改进", "goal": "确定可执行的后续动作", "complete_when": "能给出优先级和验证方式"}
